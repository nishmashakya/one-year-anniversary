<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Anniversary</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="content">

        <h2>my favorite captured memories with you &lt;3</h2>

        <div class="gallery-grid">

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_0071.JPG" alt="boy holding Dunkin drink.">
                </button>
                <figcaption>first Dunkin together</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <video muted autoplay loop playsinline>
                        <source src="media/IMG_0134.mp4" type="video/mp4" alt="flipping over a canvas.">
                    </video>
                </button>
                <figcaption>you revealing your amazing drawing of me (and the smile I fell in love with)</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_0139.JPG" alt="two paintings next to each other. one of a girl, the other of a boy.">
                </button>
                <figcaption>painting each other; such a cute date</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_0610.PNG" alt="screenshot of a facetime call with a drawing.">
                </button>
                <figcaption>throwback to our facetimes</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_1652.JPG" alt="holding hands in a skating rink.">
                </button>
                <figcaption>you taught me how to skate (kind of)</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_1663.JPG" alt="a vase with lego flowers on a windowsill.">
                </button>
                <figcaption>we built lego flowers for valentine's day</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_2012.JPG" alt="a mirror selfie of a girl and boy in a mall.">
                </button>
                <figcaption>mirror selfie</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_2032.JPG" alt="selfie of girl and boy sticking their tongues out.">
                </button>
                <figcaption>I love this selfie</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_2051.JPG" alt="selfie of girl and boy in bed.">
                </button>
                <figcaption>lazy day</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_3279.JPG" alt="selfie of girl and boy at a concert.">
                </button>
                <figcaption>Brunoo</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_3374.JPG" alt="boy taking a selfie with girl on bed laughing.">
                </button>
                <figcaption>I'm laughing but actually dying because you kept tickling me</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_3390.JPG" alt="boy holding back girl who is laughing.">
                </button>
                <figcaption>random pic from digi cam</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_3391.JPG" alt="boy looking at camera with something in his mouth.">
                </button>
                <figcaption>another one</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_3698.JPG" alt="boy making silly face.">
                </button>
                <figcaption>and another one lol</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/IMG_6919.JPG" alt="mirrow selfie of boy and girl in hotel room.">
                </button>
                <figcaption>d.c. trip</figcaption>
            </figure>

            <figure class="gallery-item">
                <button class="gallery-trigger">
                    <img src="media/hotel.jpg" alt="mirror selfie of boy and girl in bath robes in a hotel room.">
                </button>
                <figcaption>first night in the hotel</figcaption>
            </figure>

            
            
        </div>

        <div class="lightbox" hidden>
            <button class="lightbox-close" type="button" aria-label="Close preview">&times;</button>
            <div class="lightbox-content">
                <div class="lightbox-media"></div>
                <p class="lightbox-caption"></p>
            </div>
        </div>

    </div>
    <audio id="page-music" loop>
        <source src="media/soft-spot.mp3" type="audio/mpeg">
    </audio>
    <button class="music-control" type="button">Play music</button>
    <script src="index.js"></script>
</body>

</html>
